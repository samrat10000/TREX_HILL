<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Hill Kit — vehicles, world & light</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--panel:rgba(255,249,238,.74);--panel-strong:#fff9ee;--ink:#23253a;--ink-2:rgba(35,37,58,.62);--line:rgba(35,37,58,.13);--chip:rgba(35,37,58,.06);--accent:#e2672e;--sky-a:#4fa3e0;--sky-b:#bfe3f3;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--panel:rgba(20,24,42,.7);--panel-strong:#161a2c;--ink:#eef0fb;--ink-2:rgba(238,240,251,.62);--line:rgba(238,240,251,.14);--chip:rgba(238,240,251,.07)}}
:root[data-theme="dark"]{--panel:rgba(20,24,42,.7);--panel-strong:#161a2c;--ink:#eef0fb;--ink-2:rgba(238,240,251,.62);--line:rgba(238,240,251,.14);--chip:rgba(238,240,251,.07)}
*{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;overflow:hidden;background:var(--sky-b);color:var(--ink);font:14px/1.45 Nunito,"Trebuchet MS",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
#view{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.panel{position:fixed;background:var(--panel);-webkit-backdrop-filter:blur(16px) saturate(1.25);backdrop-filter:blur(16px) saturate(1.25);border:1px solid var(--line);border-radius:22px;box-shadow:0 12px 40px rgba(18,18,40,.16);transition:background .9s,color .9s,transform .35s ease}
#catalog{left:14px;top:calc(14px + env(safe-area-inset-top,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));width:276px;display:flex;flex-direction:column;overflow:hidden;z-index:3}
.brand{padding:18px 18px 2px;font:600 29px/1 Fredoka,sans-serif;letter-spacing:-.015em}
.tag{padding:6px 18px 12px;color:var(--ink-2);font-size:13px;max-width:34ch}
#search{margin:0 14px 10px;padding:9px 12px;border-radius:12px;border:1px solid var(--line);background:var(--chip);color:inherit;font:inherit}
#search::placeholder{color:var(--ink-2)}
.cats{display:flex;flex-wrap:wrap;gap:6px;padding:0 14px 10px}
.chip{border:1px solid var(--line);background:var(--chip);font-weight:700;font-size:12.5px;padding:5px 11px;border-radius:999px;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--panel-strong);border-color:transparent}
#list{flex:1;overflow:auto;padding:2px 8px 8px;overscroll-behavior:contain}
.item{display:block;width:100%;text-align:left;border:0;background:none;padding:8px 10px 8px 12px;border-radius:12px;cursor:pointer}
.item b{display:block;font:500 15.5px/1.2 Fredoka,sans-serif}
.item span{color:var(--ink-2);font-size:12.5px}
.item:hover{background:var(--chip)}
.item[aria-current="true"]{background:var(--chip);box-shadow:inset 3px 0 0 var(--accent)}
.foot{padding:10px 14px 14px;border-top:1px solid var(--line)}
.foot h4,.sec h3{font:500 13.5px Fredoka,sans-serif;margin:0 0 7px;color:var(--ink-2)}
#inspector{right:14px;top:calc(14px + env(safe-area-inset-top,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));width:316px;overflow:auto;padding:18px 18px 22px;z-index:3;overscroll-behavior:contain}
#inspector h2{font:600 27px/1.05 Fredoka,sans-serif;margin:0 0 6px;letter-spacing:-.01em}
#inspector p{margin:0;color:var(--ink-2);max-width:40ch}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:14px 0 4px}
.stat{background:var(--chip);border-radius:12px;padding:7px 9px;font-size:11.5px;color:var(--ink-2)}
.stat b{display:block;font:600 16px Fredoka,sans-serif;color:var(--ink)}
.sec{margin-top:18px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:8px 0;min-height:26px}
.row>label{font-weight:700;font-size:13px;flex:none}
.seg{display:flex;flex-wrap:wrap;gap:4px;justify-content:flex-end}
.seg button{border:1px solid var(--line);background:var(--chip);font-weight:700;font-size:12px;padding:4px 9px;border-radius:999px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--panel-strong);border-color:transparent}
.sws{display:flex;flex-wrap:wrap;gap:7px;margin-top:4px}
.sw{width:26px;height:26px;border-radius:50%;border:2px solid var(--panel-strong);box-shadow:0 0 0 1px var(--line);cursor:pointer;padding:0}
.sw[aria-pressed="true"]{box-shadow:0 0 0 2px var(--ink)}
.tog{appearance:none;-webkit-appearance:none;width:40px;height:23px;border-radius:999px;background:var(--line);position:relative;cursor:pointer;margin:0;transition:background .2s;flex:none}
.tog::after{content:"";position:absolute;top:3px;left:3px;width:17px;height:17px;border-radius:50%;background:var(--panel-strong);box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.tog:checked{background:var(--accent)}.tog:checked::after{transform:translateX(17px)}
input[type=range]{accent-color:var(--accent);width:150px}
.btn{border:1px solid var(--line);background:var(--chip);font-weight:700;font-size:13px;padding:7px 13px;border-radius:999px;cursor:pointer}
.btn.primary{background:var(--accent);color:#fff;border-color:transparent}
#sky{left:50%;top:calc(12px + env(safe-area-inset-top,0px));transform:translateX(-50%);padding:8px 16px 10px;z-index:2;border-radius:26px}
#arc{position:relative;width:380px;height:66px}
#arc svg{position:absolute;inset:0;overflow:visible}
#arc .stop{position:absolute;transform:translate(-50%,-4px);border:0;background:none;padding:14px 6px 0;cursor:pointer;font-weight:700;font-size:12px;color:var(--ink-2)}
#arc .stop::before{content:"";position:absolute;left:50%;top:0;width:8px;height:8px;margin-left:-4px;border-radius:50%;background:var(--ink-2);opacity:.45}
#arc .stop[aria-pressed="true"]{color:var(--ink)}
#sun{position:absolute;width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:50%;background:radial-gradient(circle at 40% 40%,#fff6d8,var(--accent));box-shadow:0 0 0 5px color-mix(in srgb,var(--accent) 22%,transparent),0 0 24px var(--accent);transition:left .9s cubic-bezier(.4,0,.2,1),top .9s cubic-bezier(.4,0,.2,1),background .9s;pointer-events:none}
#wx{display:flex;gap:5px;justify-content:center;margin-top:6px}
#tools{left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;align-items:center;gap:4px;padding:6px;border-radius:999px;z-index:2;max-width:calc(100vw - 640px);overflow-x:auto;scrollbar-width:none}
#tools::-webkit-scrollbar{display:none}
.tool{border:0;background:none;font-weight:700;font-size:12.5px;padding:7px 11px;border-radius:999px;cursor:pointer;white-space:nowrap}
.tool:hover{background:var(--chip)}
.tool[aria-pressed="true"]{background:var(--ink);color:var(--panel-strong)}
.sep{width:1px;align-self:stretch;margin:4px 3px;background:var(--line);flex:none}
#hud{left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);padding:12px 16px;display:none;align-items:center;gap:18px;z-index:2}
#hud.on{display:flex}
#spd{font:600 34px/1 Fredoka,sans-serif;min-width:3ch;text-align:right}
#spd small{font-size:13px;color:var(--ink-2);margin-left:3px}
#susp{display:flex;gap:6px;align-items:flex-end;height:44px}
#susp i{display:block;width:9px;height:44px;border-radius:5px;background:var(--chip);position:relative;overflow:hidden}
#susp i::after{content:"";position:absolute;left:0;right:0;bottom:0;height:var(--v,50%);background:var(--accent);border-radius:5px;transition:height .05s linear}
#keys{font-size:12px;color:var(--ink-2);max-width:26ch}
#touch{position:fixed;right:20px;bottom:calc(150px + env(safe-area-inset-bottom,0px));display:none;grid-template-columns:repeat(3,54px);gap:6px;z-index:4}
#touch button{height:54px;border-radius:16px;border:1px solid var(--line);background:var(--panel);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);font:600 18px Fredoka;touch-action:none}
.drawer-btn{display:none;position:fixed;top:calc(12px + env(safe-area-inset-top,0px));z-index:5}
#toast{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);padding:14px 20px;border-radius:16px;font:500 16px Fredoka;opacity:0;pointer-events:none;transition:opacity .4s;z-index:6}
#toast.on{opacity:1}
@media (max-width:1100px){#tools{max-width:calc(100vw - 40px);bottom:calc(14px + env(safe-area-inset-bottom,0px))}#catalog,#inspector{bottom:calc(76px + env(safe-area-inset-bottom,0px))}}
@media (max-width:860px){
 #catalog{transform:translateX(calc(-100% - 24px));top:calc(64px + env(safe-area-inset-top,0px))}#inspector{transform:translateX(calc(100% + 24px));top:calc(64px + env(safe-area-inset-top,0px));width:min(316px,calc(100vw - 28px))}
 body.cat-open #catalog,body.ins-open #inspector{transform:none}
 .drawer-btn{display:block}#dl{left:14px}#dr{right:14px}
 #sky{top:calc(60px + env(safe-area-inset-top,0px));transform:translateX(-50%) scale(.82);transform-origin:top center}
 #arc{width:340px}
 #hud{bottom:calc(70px + env(safe-area-inset-bottom,0px));gap:12px}#keys{display:none}
 body.driving #touch{display:grid}
}
@media (hover:none){body.driving #touch{display:grid}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<canvas id="view" tabindex="0" aria-label="3D model viewport. Drag to orbit, scroll to zoom."></canvas>

<aside id="catalog" class="panel" aria-label="Model catalog">
 <div class="brand">the hill kit</div>
 <div class="tag">Every vehicle, part and piece of the world, shown in every light.</div>
 <input id="search" type="search" placeholder="Find a model" aria-label="Find a model">
 <div class="cats" id="cats" role="group" aria-label="Categories"></div>
 <nav id="list" aria-label="Models"></nav>
 <div class="foot"><h4>Biome</h4><div class="seg" id="biomes" style="justify-content:flex-start"></div></div>
</aside>

<section id="sky" class="panel" aria-label="Time of day and weather">
 <div id="arc"><svg viewBox="0 0 380 66" aria-hidden="true"><defs><linearGradient id="ag" x1="0" x2="1"><stop offset="0" stop-color="var(--sky-b)"/><stop offset=".5" stop-color="var(--sky-a)"/><stop offset="1" stop-color="var(--sky-b)"/></linearGradient></defs><path d="M20 54 Q190 -22 360 54" fill="none" stroke="url(#ag)" stroke-width="3" stroke-linecap="round"/><line x1="8" y1="54" x2="372" y2="54" stroke="var(--line)" stroke-width="1"/></svg><div id="sun"></div></div>
 <div id="wx" role="group" aria-label="Weather"></div>
</section>

<aside id="inspector" class="panel" aria-label="Inspector"></aside>

<div id="tools" class="panel" role="toolbar" aria-label="View and mode">
 <button class="tool" data-mode="inspect" aria-pressed="true">Inspect</button>
 <button class="tool" data-mode="drive">Test drive</button>
 <button class="tool" data-mode="diorama">Diorama</button>
 <span class="sep"></span>
 <button class="tool" data-view="front">Front</button><button class="tool" data-view="back">Back</button><button class="tool" data-view="left">Left</button><button class="tool" data-view="right">Right</button><button class="tool" data-view="top">Top</button><button class="tool" data-view="under">Under</button><button class="tool" data-view="iso">¾</button>
 <span class="sep"></span>
 <button class="tool" id="tTurn" aria-pressed="false">Turntable</button><button class="tool" id="tEdges" aria-pressed="false">Edges</button><button class="tool" id="tGrass" aria-pressed="true">Grass</button><button class="tool" id="tSound" aria-pressed="false">Sound</button>
</div>

<div id="hud" class="panel" aria-live="off"><div id="spd">0<small>km/h</small></div><div id="susp" aria-label="Suspension travel per wheel"></div><div id="keys">W A S D or arrows to drive, Space to brake, H for lights, C to swap camera, Esc to leave.</div></div>
<div id="touch" aria-label="Touch driving controls"><span></span><button data-k="up" aria-label="Accelerate">▲</button><span></span><button data-k="left" aria-label="Steer left">◀</button><button data-k="down" aria-label="Brake or reverse">▼</button><button data-k="right" aria-label="Steer right">▶</button></div>
<button class="btn drawer-btn panel" id="dl" aria-controls="catalog">Models</button>
<button class="btn drawer-btn panel" id="dr" aria-controls="inspector">Inspect</button>
<div id="toast" class="panel" role="status"></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/utils/BufferGeometryUtils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
<script id="kit">
'use strict';
/* ============================================================================
   KIT — pure model factories. No DOM, no renderer. Every builder returns a
   THREE.Group; animated ones expose group.userData.update(dt, t, env).
   env = { wind:Number, night:0..1, time:Number }
============================================================================ */
const KIT=(function(){
const T=THREE,TAU=Math.PI*2,V3=(x,y,z)=>new T.Vector3(x,y,z),HAS_DOM=typeof document!=='undefined';
let S=1;const seed=s=>{S=(Math.abs(Math.floor(s*9973))%2147483646)+1},rnd=()=>(S=S*16807%2147483647)/2147483647,rr=(a,b)=>a+(b-a)*rnd(),pick=a=>a[Math.floor(rnd()*a.length)%a.length];
function h3(x,y,z){const h=Math.sin(x*127.1+y*311.7+z*74.7)*43758.5453;return h-Math.floor(h)}
function noise3(x,y,z){const ix=Math.floor(x),iy=Math.floor(y),iz=Math.floor(z),fx=x-ix,fy=y-iy,fz=z-iz,u=fx*fx*(3-2*fx),v=fy*fy*(3-2*fy),w=fz*fz*(3-2*fz),L=(a,b,t)=>a+(b-a)*t,h=(a,b,c)=>h3(ix+a,iy+b,iz+c);
 return L(L(L(h(0,0,0),h(1,0,0),u),L(h(0,1,0),h(1,1,0),u),v),L(L(h(0,0,1),h(1,0,1),u),L(h(0,1,1),h(1,1,1),u),v),w)}

/* ---------- materials ---------- */
const lamps=new Set(),glowSprites=new Set(),MC=new Map();
function mat(c,o={}){const k=c+'|'+JSON.stringify(o);let m=MC.get(k);if(m)return m;
 m=new T.MeshStandardMaterial({color:c,flatShading:!o.smooth,roughness:o.r??.86,metalness:o.m??0,transparent:o.op!==undefined,opacity:o.op??1,vertexColors:!!o.vc,side:o.ds?T.DoubleSide:T.FrontSide,depthWrite:o.op===undefined});
 if(o.e!==undefined){m.emissive=new T.Color(o.e);m.emissiveIntensity=o.ei??1;m.userData.base=o.ei??1;if(o.lamp)lamps.add(m)}
 MC.set(k,m);return m}
let _gt=null;function glowTex(){if(!HAS_DOM)return null;if(_gt)return _gt;const c=document.createElement('canvas');c.width=c.height=128;const g=c.getContext('2d'),r=g.createRadialGradient(64,64,0,64,64,64);
 r.addColorStop(0,'rgba(255,255,255,1)');r.addColorStop(.18,'rgba(255,255,255,.55)');r.addColorStop(.5,'rgba(255,255,255,.12)');r.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=r;g.fillRect(0,0,128,128);_gt=new T.CanvasTexture(c);return _gt}
/* glow(parent,color,size,x,y,z,auto) — additive halo. auto=true follows night level */
function glow(p,color,size,x,y,z,auto=true,op=.9){const m=new T.SpriteMaterial({map:glowTex(),color,transparent:true,opacity:op,depthWrite:false,blending:T.AdditiveBlending,fog:false});
 const s=new T.Sprite(m);s.scale.setScalar(size);s.position.set(x,y,z);s.userData.base=op;s.renderOrder=5;if(auto)glowSprites.add(s);p.add(s);return s}

/* ---------- geometry helpers ---------- */
function add(p,g,m,x=0,y=0,z=0,rx=0,ry=0,rz=0,cast=true){const o=new T.Mesh(g,m);o.position.set(x,y,z);o.rotation.set(rx,ry,rz);o.castShadow=cast;o.receiveShadow=true;p.add(o);return o}
const B=(w,h,d)=>new T.BoxGeometry(w,h,d),CY=(a,b,h,s=8,open=false,t0=0,tl=TAU)=>new T.CylinderGeometry(a,b,h,s,1,open,t0,tl),IC=(r,d=0)=>new T.IcosahedronGeometry(r,d),DO=r=>new T.DodecahedronGeometry(r,0);
function ext(pts,depth,bev=.03){const s=new T.Shape(pts.map(p=>new T.Vector2(p[0],p[1])));const d=Math.max(depth-2*bev,.002);
 const g=new T.ExtrudeGeometry(s,{depth:d,bevelEnabled:bev>0,bevelThickness:bev,bevelSize:bev,bevelOffset:-bev,bevelSegments:1,curveSegments:6});g.translate(0,0,-d/2);g.computeVertexNormals();return g}
const rect=(x0,y0,x1,y1)=>[[x0,y0],[x1,y0],[x1,y1],[x0,y1]];
const cbox=(w,h,d,b=.03)=>ext(rect(-w/2,-h/2,w/2,h/2),d,Math.min(b,w/3,h/3,d/3));
function beam(p,a,b,r,m,s=6){const d=new T.Vector3().subVectors(b,a),L=d.length(),o=add(p,CY(r,r,L,s),m);o.position.copy(a).addScaledVector(d,.5);o.quaternion.setFromUnitVectors(V3(0,1,0),d.normalize());return o}
function plank(p,a,b,w,h,m){/* box from a to b (x-y plane), oriented */const dx=b[0]-a[0],dy=b[1]-a[1],L=Math.hypot(dx,dy);return add(p,B(w,L,h),m,(a[0]+b[0])/2,(a[1]+b[1])/2,a[2]||0,0,0,Math.atan2(dy,dx)-Math.PI/2)}
const lerp2=(a,b,t)=>[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t];
function rockGeo(r,detail,sq,sd,top,base){const g=IC(r,detail),p=g.attributes.position,v=new T.Vector3();
 for(let i=0;i<p.count;i++){v.fromBufferAttribute(p,i);const n=noise3(v.x*1.4+sd,v.y*1.4,v.z*1.4)*.55+noise3(v.x*3.2+sd,v.y*3.2+7,v.z*3.2)*.25;v.multiplyScalar(.72+n*.62);v.y*=sq;if(v.y<-r*.25*sq)v.y=-r*.25*sq;p.setXYZ(i,v.x,v.y,v.z)}
 g.computeVertexNormals();const n=g.attributes.normal,col=new Float32Array(p.count*3),c=new T.Color(),A=new T.Color(base),Bc=new T.Color(top);
 for(let i=0;i<p.count;i++){c.copy(A).lerp(Bc,T.MathUtils.smoothstep(n.getY(i),.35,.85));c.multiplyScalar(.92+h3(Math.round(p.getX(i)*9),Math.round(p.getY(i)*9),sd)*.14);col.set([c.r,c.g,c.b],i*3)}
 g.setAttribute('color',new T.BufferAttribute(col,3));return g}

/* ---------- cloth (verlet) — physically simulated flags ---------- */
function Cloth(w,h,nx,ny,color){const g=new T.PlaneGeometry(w,h,nx,ny),N=(nx+1)*(ny+1),P=new Float32Array(N*3),Q=new Float32Array(N*3),cons=[];
 const id=(i,j)=>j*(nx+1)+i,dx=w/nx,dy=h/ny;
 for(let j=0;j<=ny;j++)for(let i=0;i<=nx;i++){if(i<nx)cons.push(id(i,j),id(i+1,j),dx);if(j<ny)cons.push(id(i,j),id(i,j+1),dy);if(i<nx&&j<ny)cons.push(id(i,j),id(i+1,j+1),Math.hypot(dx,dy))}
 const mesh=new T.Mesh(g,new T.MeshStandardMaterial({color,side:T.DoubleSide,roughness:.9,flatShading:true}));mesh.frustumCulled=false;mesh.castShadow=true;
 let init=false;const tmp=new T.Vector3();
 function update(dt,top,bot,wind,t){dt=Math.min(dt,1/30);const pos=g.attributes.position.array;
  if(!init){for(let j=0;j<=ny;j++)for(let i=0;i<=nx;i++){const k=id(i,j)*3;tmp.copy(top).lerp(bot,j/ny);P[k]=Q[k]=tmp.x-i*dx*.2;P[k+1]=Q[k+1]=tmp.y;P[k+2]=Q[k+2]=tmp.z+i*dx}init=true}
  const d2=dt*dt;
  for(let j=0;j<=ny;j++)for(let i=1;i<=nx;i++){const k=id(i,j)*3,gust=1+.6*Math.sin(t*4.1+i*.9+j*.7)+.3*Math.sin(t*9.3+i);
   for(let a=0;a<3;a++){const v=(P[k+a]-Q[k+a])*.985;Q[k+a]=P[k+a];P[k+a]+=v+((a===1?-9.8:0)+wind[a]*gust)*d2}}

 if(k==='fence'){const p=mat(0x8a6a4a);for(let i=0;i<6;i++)beam(g,V3(i*1.4-3.5,0,0),V3(i*1.4-3.5,1.1,0),.06,p,5);for(const y of[.45,.95])add(g,B(7.2,.1,.05),p,0,y,.07,0,0,(rnd()-.5)*.04)}
 if(k==='mailbox'){beam(g,V3(0,0,0),V3(0,1.05,0),.05,mat(0x6a4a32),5);add(g,CY(.18,.18,.55,10,false,0,Math.PI).rotateZ(Math.PI/2),mat(0x4a74b4,{r:.5}),0,1.12,0);add(g,B(.55,.18,.36),mat(0x4a74b4,{r:.5}),0,1.06,0);add(g,B(.04,.22,.05),mat(0xd8442e),.05,1.25,.2)}
 if(k==='pump'){add(g,cbox(.7,1.7,.5,.06),mat(0xd8442e,{r:.5}),0,.85,0);add(g,cbox(.5,.4,.06,.02),mat(0xf2eee6,{e:0xfff0d0,ei:.8,lamp:true}),0,1.3,.26);add(g,IC(.22,1),mat(0xf2eee6,{e:0xfff0d0,ei:1,lamp:true}),0,1.9,0);beam(g,V3(.36,1,0),V3(.6,.6,.2),.03,mat(0x1d1d20),4);add(g,B(.9,.1,.7),mat(0x8d8a86),0,.05,0)}

function beacon(o={}){const g=new T.Group(),rm=new T.MeshBasicMaterial({color:0xffd060,transparent:true,opacity:.7,blending:T.AdditiveBlending,depthWrite:false}),ring=add(g,new T.TorusGeometry(2.2,.05,4,48),rm,0,.1,0,Math.PI/2,0,0,false);
 const w=Whip(3,4,mat(0xf2eee6,{r:.4}),null);g.add(w.root);const cl=Cloth(1,.6,8,5,0xf2b33a);const pal=add(g,cbox(1,.7,1,.04),mat(0xa87b4a),1.2,.35,.6,0,.4,0);add(g,B(1.02,.08,1.02),mat(0xd8442e),1.2,.4,.6,0,.4,0,false);
 g.userData.world=[cl.mesh];const tp=new T.Vector3(),bt=new T.Vector3();g.userData.update=(dt,t,env)=>{ring.scale.setScalar(1+Math.sin(t*2)*.06);rm.opacity=.35+.35*(.5+.5*Math.sin(t*2));w.update(dt,env.wind);w.top.getWorldPosition(tp);bt.set(0,-.6,0);w.top.localToWorld(bt);cl.update(dt,tp,bt,[-2-env.wind*3,0,1.5+env.wind],t)};return g}

function birdMesh(col){const b=new T.Group(),bm=mat(col),wm=mat(col,{ds:true});add(b,IC(.12,0),bm,0,0,0,0,0,0,false).scale.set(2.3,.8,.9);add(b,IC(.07,0),bm,.25,.04,0,0,0,0,false);add(b,CY(0,.035,.1,4).rotateZ(-Math.PI/2),mat(0xe8a33a),.36,.03,0,0,0,0,false);add(b,tri([-.2,0,0],[-.38,.02,.1],[-.38,.02,-.1]),wm,0,0,0,0,0,0,false);
 const L=new T.Group(),R=new T.Group();b.add(L,R);add(R,tri([-.12,0,0],[.12,0,0],[-.06,0,.55]),wm,0,0,0,0,0,0,false);add(L,tri([.12,0,0],[-.12,0,0],[-.06,0,-.55]),wm,0,0,0,0,0,0,false);b.userData.w=[L,R];return b}
function flock(o={}){seed(o.seed??19);const g=new T.Group(),n=o.n||14,birds=[];for(let i=0;i<n;i++){const b=birdMesh(o.dark?0x2b2b33:0xf2f0ea);b.userData.ph=rnd()*TAU;b.userData.r=rr(4,9);b.userData.h=rr(4,7);b.userData.s=rr(.35,.55);g.add(b);birds.push(b)}
 g.userData.update=(dt,t)=>{for(const b of birds){const u=b.userData,a=t*u.s+u.ph,x=Math.cos(a)*u.r,z=Math.sin(a)*u.r,y=u.h+Math.sin(t*.7+u.ph)*.6;b.position.set(x,y,z);b.rotation.set(0,-a-Math.PI/2+Math.PI,Math.sin(t+u.ph)*.2);
  const flap=Math.max(0,Math.sin(t*.6+u.ph*3))>.4?Math.sin(t*14+u.ph)*.9:.05;b.userData.w[0].rotation.x=-flap;b.userData.w[1].rotation.x=flap}};return g}
function deer(o={}){const g=new T.Group(),c=mat(0xa8693e),cl=mat(0xe8d6b8),dk=mat(0x2b2220),body=new T.Group();g.add(body);
 add(body,IC(.5,1),c,0,1.15,0).scale.set(1.5,.75,.6);add(body,IC(.3,0),cl,-.6,1.2,0).scale.set(.4,.6,.6);
 for(const[x,z]of[[.5,.18],[.5,-.18],[-.5,.18],[-.5,-.18]]){beam(body,V3(x,1,z),V3(x,.45,z),.05,c,5);beam(body,V3(x,.45,z),V3(x+.03,0,z),.035,c,5);add(body,B(.07,.06,.07),dk,x+.03,.03,z)}
 const neck=new T.Group();neck.position.set(.6,1.3,0);body.add(neck);beam(neck,V3(0,0,0),V3(.25,.55,0),.12,c,6);const head=new T.Group();head.position.set(.27,.6,0);neck.add(head);
 add(head,IC(.15,0),c,.08,0,0).scale.set(1.5,.9,.85);add(head,IC(.06,0),dk,.3,-.04,0);for(const z of[-1,1]){add(head,tri([0,0,0],[-.06,.22,z*.12],[.06,.18,z*.08]),mat(0x8a5432,{ds:true}),-.02,.05,z*.06);add(head,IC(.025,0),dk,.16,.04,z*.09)}
 if(o.buck!==false)for(const z of[-1,1]){const a=V3(0,.12,z*.05),b=V3(-.1,.5,z*.22);beam(head,a,b,.02,mat(0xd8c8a8),4);beam(head,V3(-.05,.3,z*.13),V3(.12,.45,z*.2),.015,mat(0xd8c8a8),4);beam(head,b,V3(.05,.62,z*.3),.015,mat(0xd8c8a8),4)}
 g.userData.update=(dt,t)=>{const k=Math.sin(t*.35),graze=T.MathUtils.smoothstep(k,.2,.6);neck.rotation.z=-graze*1.5;head.rotation.z=graze*.4+Math.sin(t*2.3)*.03*(1-graze);body.position.y=Math.sin(t*1.7)*.01};return g}
function butterflies(o={}){seed(o.seed??20);const g=new T.Group(),bs=[];for(let i=0;i<8;i++){const b=new T.Group(),c=pick([0xf2b632,0xf2f0ea,0x4a8ad8,0xe8622f]),m=mat(c,{ds:true}),L=add(b,tri([0,0,0],[.12,0,.14],[-.08,0,.12]),m,0,0,0,0,0,0,false),R=add(b,tri([0,0,0],[-.08,0,-.12],[.12,0,-.14]),m,0,0,0,0,0,0,false);b.userData={L,R,ph:rnd()*9};g.add(b);bs.push(b)}
 g.userData.update=(dt,t)=>{for(const b of bs){const u=b.userData,a=t*.4+u.ph;b.position.set(Math.cos(a)*2+Math.sin(t*1.3+u.ph)*.6,.8+Math.sin(t*2+u.ph)*.4,Math.sin(a*1.3)*2);b.rotation.y=-a;const f=Math.sin(t*22+u.ph)*1.1;u.L.rotation.x=f;u.R.rotation.x=-f}};return g}

   WEATHER & FX  (also used world-wide by the app)
============================================================================ */
function Rain(n=2200,box=44){const P=new Float32Array(n*6),g=new T.BufferGeometry();g.setAttribute('position',new T.BufferAttribute(P,3));
 const m=new T.LineBasicMaterial({color:0xb7cad8,transparent:true,opacity:.5,depthWrite:false}),ls=new T.LineSegments(g,m);ls.frustumCulled=false;const seedX=[];for(let i=0;i<n;i++)seedX.push([Math.random()*box-box/2,Math.random()*30,Math.random()*box-box/2,.8+Math.random()*.6]);
 ls.userData.update=(dt,t,env,center)=>{const c=center||V3(0,0,0),wx=-.25-env.wind*.3,amt=env.rain??1;m.opacity=.45*amt;ls.visible=amt>.02;if(!ls.visible)return;
  for(let i=0;i<n;i++){const s=seedX[i];s[1]-=dt*22*s[3];if(s[1]<-2){s[1]+=30}const y=s[1]+c.y-6,x=s[0]+c.x+((y-c.y)*wx*-.0),z=s[2]+c.z,k=i*6,l=.55*s[3];P[k]=x;P[k+1]=y;P[k+2]=z;P[k+3]=x-wx*l;P[k+4]=y+l;P[k+5]=z}g.attributes.position.needsUpdate=true};return ls}
function Snow(n=2600,box=46){const P=new Float32Array(n*3),g=new T.BufferGeometry();g.setAttribute('position',new T.BufferAttribute(P,3));const m=new T.PointsMaterial({color:0xffffff,size:.16,map:glowTex(),transparent:true,depthWrite:false,opacity:.95}),pt=new T.Points(g,m);pt.frustumCulled=false;
 const S=[];for(let i=0;i<n;i++)S.push([Math.random()*box-box/2,Math.random()*26,Math.random()*box-box/2,Math.random()*9]);
 pt.userData.update=(dt,t,env,center)=>{const c=center||V3(0,0,0),amt=env.snow??1;pt.visible=amt>.02;m.opacity=.95*amt;if(!pt.visible)return;for(let i=0;i<n;i++){const s=S[i];s[1]-=dt*(1.4+s[3]*.1);s[0]+=dt*(env.wind*1.2+Math.sin(t+s[3])*.4);if(s[1]<-2)s[1]+=26;if(s[0]>box/2)s[0]-=box;
  P[i*3]=s[0]+c.x;P[i*3+1]=s[1]+c.y-5;P[i*3+2]=s[2]+c.z+Math.cos(t*.8+s[3])*.3}g.attributes.position.needsUpdate=true};return pt}
function boltPath(a,b,depth){const pts=[a];const segs=14;for(let i=1;i<segs;i++){const t=i/segs,p=a.clone().lerp(b,t);p.x+=(Math.random()-.5)*6*(1-t*.4);p.z+=(Math.random()-.5)*6*(1-t*.4);pts.push(p)}pts.push(b);return pts}
function Lightning(){const g=new T.Group(),m=new T.MeshBasicMaterial({color:0xf4f6ff,transparent:true,opacity:0,blending:T.AdditiveBlending,depthWrite:false,fog:false});let life=0,flash=0;
 function tube(pts,r){const cp=new T.CurvePath();for(let i=0;i<pts.length-1;i++)cp.add(new T.LineCurve3(pts[i],pts[i+1]));return new T.Mesh(new T.TubeGeometry(cp,pts.length*2,r,4,false),m)}
 g.userData.strike=(at)=>{while(g.children.length){const c=g.children.pop();c.geometry.dispose()}const top=V3(at.x+(Math.random()-.5)*10,at.y+60,at.z),pts=boltPath(top,at);g.add(tube(pts,.35));for(let k=0;k<3;k++){const i=3+Math.floor(Math.random()*8),s=pts[i],e=s.clone().add(V3((Math.random()-.5)*16,-14-Math.random()*10,(Math.random()-.5)*16));g.add(tube(boltPath(s,e),.14))}life=.45;flash=1};
 g.userData.update=(dt)=>{life-=dt;flash=Math.max(0,flash-dt*3.2);m.opacity=life>0?(Math.random()>.25?1:.2)*Math.min(1,life*4):0;g.userData.flash=flash*(life>0?1:0)};g.userData.flash=0;return g}
function Fireflies(n=60,r=10){const g=new T.Group(),f=[];for(let i=0;i<n;i++){const s=glow(g,0xd8ff70,.32,0,0,0,false,0);s.userData.p=[Math.random()*r*2-r,Math.random()*1.6+.3,Math.random()*r*2-r,Math.random()*30];f.push(s)}
 g.userData.update=(dt,t,env)=>{const vis=(env.night??1);for(const s of f){const p=s.userData.p;s.position.set(p[0]+Math.sin(t*.3+p[3])*1.2,p[1]+Math.sin(t*.9+p[3]*2)*.3,p[2]+Math.cos(t*.25+p[3])*1.2);s.material.opacity=vis*Math.max(0,Math.sin(t*1.7+p[3]))*.95}};return g}
function Aurora(){const geo=new T.PlaneGeometry(220,46,80,1),m=new T.ShaderMaterial({uniforms:{t:{value:0},op:{value:1}},transparent:true,depthWrite:false,blending:T.AdditiveBlending,side:T.DoubleSide,fog:false,
 vertexShader:'uniform float t;varying vec2 vU;void main(){vU=uv;vec3 p=position;p.z+=sin(p.x*.05+t*.3)*14.+sin(p.x*.13+t*.5)*5.;gl_Position=projectionMatrix*modelViewMatrix*vec4(p,1.);}',
 fragmentShader:'uniform float t,op;varying vec2 vU;void main(){float b=pow(1.-vU.y,1.2)*smoothstep(0.,.12,vU.y)*.6+smoothstep(.0,.04,vU.y)*.0;float s=.55+.45*sin(vU.x*60.+t*1.3)*sin(vU.x*23.-t*.7);vec3 c=mix(vec3(.2,1.,.55),vec3(.55,.3,1.),vU.y);gl_FragColor=vec4(c*b*s*op,1.);}'});
 const a=new T.Mesh(geo,m);a.userData.update=(dt,t,env)=>{m.uniforms.t.value=t;m.uniforms.op.value=env.aurora??1;a.visible=(env.aurora??1)>.02};return a}
function cloud(o={}){seed(o.seed??21);const g=new T.Group(),m=mat(0xffffff,{r:1});for(let i=0;i<7;i++){const r=rr(1,2.2);add(g,IC(r,1),m,rr(-3,3),rr(0,.8),rr(-1.2,1.2),0,0,0,false).scale.y=.65}g.userData.update=(dt,t)=>{g.position.x=Math.sin(t*.05)*2};return g}
function fogBank(o={}){const g=new T.Group(),S=[];for(let i=0;i<14;i++){const m=new T.SpriteMaterial({map:glowTex(),color:0xffffff,transparent:true,opacity:.22,depthWrite:false});const s=new T.Sprite(m);s.scale.set(9,3.5,1);s.position.set(Math.random()*16-8,1.2+Math.random()*1.2,Math.random()*10-5);s.userData.p=Math.random()*9;g.add(s);S.push(s)}
 g.userData.update=(dt,t,env)=>S.forEach(s=>{s.position.x+=dt*(.2+env.wind*.4);if(s.position.x>9)s.position.x=-9;s.material.opacity=.18+.06*Math.sin(t*.4+s.userData.p)});return g}
function lightningDemo(){const g=new T.Group(),L=Lightning();g.add(L);let next=.5;const lt=new T.PointLight(0xc8d8ff,0,80,1);lt.position.y=20;g.add(lt);
 g.userData.update=(dt,t,env)=>{next-=dt;if(next<0){L.userData.strike(V3((Math.random()-.5)*8,0,-6-Math.random()*6));next=2+Math.random()*2.5}L.userData.update(dt);lt.intensity=L.userData.flash*6};return g}
function rainDemo(){const g=new T.Group(),r=Rain(900,12);g.add(r);const c=V3(0,4,0);g.userData.update=(dt,t,env)=>r.userData.update(dt,t,{...env,rain:1},c);return g}
function snowDemo(){const g=new T.Group(),s=Snow(900,12);g.add(s);const c=V3(0,4,0);g.userData.update=(dt,t,env)=>s.userData.update(dt,t,{...env,snow:1},c);return g}
function auroraDemo(){const g=new T.Group(),a=Aurora();a.scale.setScalar(.12);a.position.set(0,6,-4);g.add(a);g.userData.update=(dt,t,env)=>a.userData.update(dt,t,{aurora:1});return g}

<script>

/* ---------- sky, stars, backdrop ranges ---------- */
const skyU={top:{value:C(0)},hor:{value:C(0)},gnd:{value:C(0)},sunDir:{value:V3(0,1,0)},sunCol:{value:C(0)},sunSize:{value:1},flash:{value:0}};

const starG=new T.BufferGeometry(),sp=[];for(let i=0;i<1600;i++){const a=Math.random()*TAU,y=Math.random()*.95+.05,r=Math.sqrt(1-y*y);sp.push(Math.cos(a)*r*560,y*560,Math.sin(a)*r*560)}starG.setAttribute('position',new T.Float32BufferAttribute(sp,3));

/* ---------- terrain ---------- */

 let h=(n(x*.018,0,z*.018)-.5)*16*sm(28,95,d)+(n(x*.07+5,1,z*.07)-.5)*2.8*flat+(n(x*.3,2,z*.3)-.5)*.5*flat;

const skirtM=new T.MeshLambertMaterial({color:0x9c7a3c}),skirt=new T.Mesh(new T.CircleGeometry(900,32).rotateX(-Math.PI/2),skirtM);skirt.position.y=-4;scene.add(skirt);

/* ---------- grass (instanced, wind + push) ---------- */
const GU=T.UniformsUtils.merge([T.UniformsLib.fog,{uTime:{value:0},uWind:{value:V3(1,1,.4)},uBase:{value:C(0)},uTip:{value:C(0)},uSun:{value:C(0)},uAmb:{value:C(0)},uPush:{value:new T.Vector4()},uPush2:{value:new T.Vector4()},uSnow:{value:0}}]);

#include <common>
#include <fog_pars_vertex>
void main(){vH=uv.y;vec4 wp=modelMatrix*instanceMatrix*vec4(position,1.);float ph=wp.x*.32+wp.z*.21;float w=sin(uTime*1.6+ph)*.55+sin(uTime*3.7+ph*2.3)*.18+.35;float bend=vH*vH;

(function(){const d=new T.Object3D(),c=new T.Color();let i=0,tries=0;while(i<GN&&tries<GN*4){tries++;const a=Math.random()*TAU,r=Math.sqrt(Math.random())*80,x=Math.cos(a)*r,z=Math.sin(a)*r,h=H(x,z);

const wg=new T.PlaneGeometry(90,90,90,90);wg.rotateX(-Math.PI/2);wg.translate(LAKE[0],0,LAKE[1]);const wd=new Float32Array(wg.attributes.position.count);for(let i=0;i<wd.length;i++)wd[i]=WATER_Y-H(wg.attributes.position.getX(i),wg.attributes.position.getZ(i));wg.setAttribute('aDepth',new T.BufferAttribute(wd,1));

 highland:{name:'Highland',grass:[0x2f5a2c,0x8cbf5a],ground:0x4c6a36,dirt:0x8a7552,sand:0xc8b88a,rock:0x7d8293,dens:1,trees:[['pine','summer',6],['pine','blue',2],['oak','summer',1]],bush:['green','sage'],rocks:'cluster',aurora:1,water:[0x1d5a6e,0x3a9aa8]},
 autumn:{name:'Autumn',grass:[0x8a3e24,0xeb8f48],ground:0x8a4a2c,dirt:0xa8724a,sand:0xd8b88a,rock:0x8a7d80,dens:1,trees:[['aspen','autumn',4],['maple','autumn',3],['pine','summer',2],['pine','autumn',2]],bush:['autumn'],rocks:'boulder',water:[0x1d6f86,0x3fc1c9]},
 desert:{name:'Desert',grass:[0x8a6a3a,0xd9b46a],ground:0xd49a62,dirt:0xc98a58,sand:0xe8c48e,rock:0xb8583a,dens:.2,trees:[['cactus',null,4],['palm',null,1],['snag',null,1]],bush:['desert'],rocks:'mesa',mt:0xc0603a,water:[0x1f7a7a,0x56d2c2]},
 alpine:{name:'Snowline',grass:[0x8a8f9a,0xe8ecf4],ground:0xe8ecf4,dirt:0xb8b2bc,sand:0xd8d8e0,rock:0x7d8293,dens:.3,trees:[['pine','winter',6]],bush:['snow'],rocks:'snow',cover:1,aurora:1,mt:0xf4f6fb,water:[0x2a5a78,0x6aa8c8]},
 coast:{name:'Coast',grass:[0x6a7a32,0xd2d27a],ground:0xa89a5a,dirt:0xc2a26a,sand:0xf0dcae,rock:0x8a8d9a,dens:.7,trees:[['palm',null,4],['pine','summer',2]],bush:['green','sage'],rocks:'cluster',water:[0x0f8a9a,0x5ae4dc]}};
let scatter=null;
function bake(objs){const buckets=new Map();for(const o of objs){o.updateMatrixWorld(true);o.traverse(m=>{if(!m.isMesh||m.material.transparent)return;let g=m.geometry.index?m.geometry.toNonIndexed():m.geometry.clone();
 for(const k of Object.keys(g.attributes))if(!['position','normal','color'].includes(k))g.deleteAttribute(k);if(!g.attributes.normal)g.computeVertexNormals();g.applyMatrix4(m.matrixWorld);const key=m.material.uuid;if(!buckets.has(key))buckets.set(key,{m:m.material,gs:[]});buckets.get(key).gs.push(g)})}
 const out=new T.Group();for(const{m,gs}of buckets.values()){const mg=T.BufferGeometryUtils.mergeBufferGeometries(gs,false);gs.forEach(g=>g.dispose());if(!mg)continue;const me=new T.Mesh(mg,m);me.castShadow=me.receiveShadow=true;out.add(me)}return out}
function paintTerrain(b){const col=tg.attributes.color,n=tg.attributes.normal,c=new T.Color(),G=C(b.ground),D=C(b.dirt),S=C(b.sand),Rk=C(b.rock);
 for(let i=0;i<tp.count;i++){const x=tp.getX(i),y=tp.getY(i),z=tp.getZ(i),nz=K.noise3(x*.15,0,z*.15);c.copy(G).multiplyScalar(.86+nz*.24);c.lerp(D,roadF(x,z)*.92);c.lerp(S,1-sm(WATER_Y+.2,WATER_Y+1.2,y));c.lerp(Rk,sm(.82,.68,n.getY(i))*.8);col.setXYZ(i,c.r,c.g,c.b)}

 const ok=(x,z,clr=1)=>Math.hypot(x,z)>13&&roadF(x,z)<.05&&Math.abs(Math.hypot(x,z)-TRACK)>4.5*clr&&H(x,z)>WATER_Y+.4;
 for(let i=0,t=0;i<(MOBILE?110:180)&&t<3000;t++){const a=Math.random()*TAU,r=14+Math.pow(Math.random(),.8)*120,x=Math.cos(a)*r,z=Math.sin(a)*r;if(!ok(x,z))continue;
  let w=Math.random()*wsum,sp=b.trees[0];for(const tr of b.trees){w-=tr[2];if(w<=0){sp=tr;break}}const cl=K.noise3(x*.04,3,z*.04);if(cl<.38&&Math.random()<.6)continue;place(treeOf(sp,sd++),x,z,.8+Math.random()*.6);i++}
 for(let i=0,t=0;i<60&&t<1500;t++){const a=Math.random()*TAU,r=12+Math.random()*90,x=Math.cos(a)*r,z=Math.sin(a)*r;if(!ok(x,z,.6))continue;place(K.bush({tone:b.bush[i%b.bush.length],seed:sd++}),x,z,.8+Math.random()*.7);i++}
 for(let i=0,t=0;i<34&&t<1500;t++){const a=Math.random()*TAU,r=12+Math.random()*110,x=Math.cos(a)*r,z=Math.sin(a)*r;if(!ok(x,z,.6))continue;
  const kind=b.rocks==='mesa'?(r>60&&i<6?'mesa':'boulder'):b.rocks==='snow'?'boulder':b.rocks==='cluster'&&i%3?'cluster':'boulder';place(K.rock({kind,seed:sd++,snow:b.rocks==='snow',tone:b.rocks==='mesa'?0xa86a4a:undefined}),x,z,kind==='mesa'?1+Math.random():.6+Math.random()*1.1);i++}

/* ---------- time of day + weather presets ---------- */

 $('#list').innerHTML=items.length?items.map(e=>`<button class="item" data-id="${e.id}" aria-current="${e.id===cur.id}"><b>${e.name}</b><span>${e.blurb}</span></button>`).join(''):'<p class="tag">No model matches that search. Try a category name, like “trees” or “lights”.</p>'}
function markList(){document.querySelectorAll('.item').forEach(b=>b.setAttribute('aria-current',b.dataset.id===cur.id))}
const hex=n=>'#'+C(n).getHexString();
function control(x,o){const v=o[x.k];
 if(x.t==='swatch'){const sw=x.sw||Object.values(K.PAINTS),cur=typeof v==='string'?K.PAINTS[v]:v;const keys=x.sw?x.sw:Object.keys(K.PAINTS);return`<div class="sec-row"><div class="row"><label>${x.l}</label></div><div class="sws">${keys.map((key,i)=>{const val=x.sw?key:K.PAINTS[key];return`<button class="sw" style="background:${hex(val)}" data-k="${x.k}" data-v="${x.sw?val:key}" data-n="${x.sw?'1':''}" aria-label="${x.sw?hex(val):key}" aria-pressed="${(x.sw?val:key)==v}"></button>`}).join('')}</div></div>`}
 if(x.t==='seg')return`<div class="row"><label>${x.l}</label><div class="seg">${x.v.map(s=>`<button data-k="${x.k}" data-v="${s}" aria-pressed="${s==v}">${({allterrain:'all-terrain',inline6:'inline-6',twotone:'two-tone'})[s]||s}</button>`).join('')}</div></div>`;
 if(x.t==='toggle')return`<div class="row"><label for="o_${x.k}">${x.l}</label><input class="tog" type="checkbox" id="o_${x.k}" data-k="${x.k}" ${v?'checked':''}></div>`;
 if(x.t==='range')return`<div class="row"><label for="o_${x.k}">${x.l}</label><input type="range" id="o_${x.k}" data-k="${x.k}" min="${x.min}" max="${x.max}" step="${x.step}" value="${v??x.d??x.min}"></div>`;
 if(x.t==='seed')return`<div class="row"><label>${x.l}</label><button class="btn" data-seed="1">Reroll</button></div>`;return''}
function renderInspector(){const e=ENTRY[cur.id],o=OPTS[cur.id],st=stats();let h=`<h2>${e.name}</h2><p>${e.blurb}</p><div class="stats"><div class="stat"><b>${(st.tris/1000).toFixed(1)}k</b>triangles</div><div class="stat"><b>${st.meshes}</b>parts</div>`;
 if(e.vehicle){const E=K.ENGINES[o.engine];h+=`<div class="stat"><b>${E.hp}</b>hp</div></div><div class="row" style="margin-top:12px"><span style="color:var(--ink-2);font-size:12.5px">${E.name}, ${K.SUSP[o.susp].name.toLowerCase()} springs</span><button class="btn primary" data-act="drive">${drive.on?'Driving':'Test drive'}</button></div>`;
  for(const s of K.VOPTS)h+=`<div class="sec"><h3>${s.sec}</h3>${s.items.map(x=>control(x,o)).join('')}</div>`}
 else{h+=`<div class="stat"><b>${st.lights}</b>lights</div></div>`;if(e.opts&&e.opts.length)h+=`<div class="sec"><h3>Options</h3>${e.opts.map(x=>control(x,o)).join('')}</div>`;h+=`<div class="sec"><h3>Try it in</h3><p>Switch the sky above to see how it reacts to dusk, night, storm and snow.</p></div>`}
 $('#inspector').innerHTML=h}
let rebuildQ=0;function setOpt(k,v){OPTS[cur.id][k]=v;if(!rebuildQ){rebuildQ=requestAnimationFrame(()=>{rebuildQ=0;const rot=cur.obj?cur.obj.rotation.y:0;build(cur.id,true);cur.obj.rotation.y=rot})}}
$('#inspector').addEventListener('click',ev=>{const b=ev.target.closest('button');if(!b)return;if(b.dataset.act==='drive'){setModeUI('drive');return}if(b.dataset.seed){setOpt('seed',(OPTS[cur.id].seed||1)+1);return}if(b.dataset.k){let v=b.dataset.v;if(b.dataset.n)v=+v;setOpt(b.dataset.k,v)}});
$('#inspector').addEventListener('change',ev=>{const i=ev.target;if(i.classList.contains('tog'))setOpt(i.dataset.k,i.checked)});
$('#inspector').addEventListener('input',ev=>{const i=ev.target;if(i.type==='range')setOpt(i.dataset.k,+i.value)});
$('#list').addEventListener('click',ev=>{const b=ev.target.closest('.item');if(!b)return;if(dio.on)setModeUI('inspect');build(b.dataset.id);document.body.classList.remove('cat-open')});
$('#cats').addEventListener('click',ev=>{const b=ev.target.closest('[data-cat]');if(!b)return;S.cat=b.dataset.cat;uiSync();renderList()});
$('#search').addEventListener('input',ev=>{S.q=ev.target.value;renderList()});
$('#biomes').addEventListener('click',ev=>{const b=ev.target.closest('[data-biome]');if(!b)return;S.biome=b.dataset.biome;paintTerrain(BIOMES[S.biome]);buildScatter(BIOMES[S.biome]);grass.count=Math.floor(grass.userData.max*BIOMES[S.biome].dens);setMode()});
$('#arc').addEventListener('click',ev=>{const b=ev.target.closest('[data-time]');if(b){S.time=b.dataset.time;setMode()}});
$('#wx').addEventListener('click',ev=>{const b=ev.target.closest('[data-wx]');if(b){S.wx=b.dataset.wx;setMode()}});
function setModeUI(m){if(m===S.mode&&m!=='drive')return;if(S.mode==='drive')stopDrive();if(S.mode==='diorama'){clearDiorama();frame('iso')}S.mode=m;if(m==='drive')startDrive();if(m==='diorama'){buildDiorama();camTo(V3(26,9,24),V3(0,1.5,0),1.4)}uiSync();renderInspector()}
$('#tools').addEventListener('click',ev=>{const b=ev.target.closest('button');if(!b)return;if(b.dataset.mode)return setModeUI(b.dataset.mode);if(b.dataset.view){if(drive.on){drive.camMode='orbit';ctl.enabled=true}frame(b.dataset.view);return}
 if(b.id==='tTurn')S.turn=!S.turn;if(b.id==='tEdges'){S.edges=!S.edges;edges(S.edges)}if(b.id==='tGrass')S.grass=!S.grass;if(b.id==='tSound'){S.sound=!S.sound;AU.set(S.sound)}uiSync()});
$('#dl').onclick=()=>document.body.classList.toggle('cat-open');$('#dr').onclick=()=>document.body.classList.toggle('ins-open');
function uiSync(){document.querySelectorAll('[data-time]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.time===S.time));document.querySelectorAll('[data-wx]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.wx===S.wx));
 document.querySelectorAll('[data-cat]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.cat===S.cat));document.querySelectorAll('[data-biome]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.biome===S.biome));
 document.querySelectorAll('[data-mode]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.mode===S.mode));$('#tTurn').setAttribute('aria-pressed',S.turn);$('#tEdges').setAttribute('aria-pressed',S.edges);$('#tGrass').setAttribute('aria-pressed',S.grass);$('#tSound').setAttribute('aria-pressed',S.sound);
 const st=STOPS.find(s=>s.k===S.time);$('#sun').style.left=st.x/3.8+'%';$('#sun').style.top=st.y+'px'}
let toastT=0;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),1800)}
const KEYMAP={KeyW:'up',ArrowUp:'up',KeyS:'down',ArrowDown:'down',KeyA:'left',ArrowLeft:'left',KeyD:'right',ArrowRight:'right',Space:'brake'};
addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;if(drive.on){if(KEYMAP[e.code]){drive.keys[KEYMAP[e.code]]=true;e.preventDefault()}
 if(e.code==='Escape')setModeUI('inspect');if(e.code==='KeyH'){drive.lightOverride=drive.lightOverride===1?0:1;toast(drive.lightOverride?'Lights on':'Lights off')}if(e.code==='KeyC'){drive.camMode=drive.camMode==='chase'?'orbit':'chase';ctl.enabled=drive.camMode==='orbit';toast(drive.camMode==='chase'?'Chase camera':'Free camera')}}});
addEventListener('keyup',e=>{if(KEYMAP[e.code])drive.keys[KEYMAP[e.code]]=false});
document.querySelectorAll('#touch button').forEach(b=>{const k=b.dataset.k,on=v=>e=>{e.preventDefault();drive.keys[k]=v};b.addEventListener('pointerdown',on(true));b.addEventListener('pointerup',on(false));b.addEventListener('pointerleave',on(false))});

/* ---------- frame loop ---------- */
const clock=new T.Clock(),sunDir=V3(),tmpC=C(0);let uiT=0,acc=0;
function lerpP(k){for(const c of COL)P[c].lerp(TP[c],k);for(const n of NUM)P[n]+=(TP[n]-P[n])*k}
function loop(){const dt=Math.min(clock.getDelta(),1/20),t=clock.elapsedTime;lerpP(1-Math.exp(-dt*(RM?30:2.2)));
 const el=P.el*Math.PI/180,az=P.az*Math.PI/180;sunDir.set(Math.cos(el)*Math.cos(az),Math.sin(el),Math.cos(el)*Math.sin(az));
 const focus=drive.on?V3(drive.x,drive.y,drive.z):ctl.target;
 sun.position.copy(focus).addScaledVector(sunDir,70);sun.target.position.copy(focus);sun.color.copy(P.sun);sun.intensity=P.si*sm(-2,4,P.el);
 hemi.color.copy(P.hs);hemi.groundColor.copy(P.hg);hemi.intensity=P.hi;scene.fog.color.copy(P.fog);scene.fog.near=P.fn;scene.fog.far=P.ff;R.setClearColor(P.fog);
 skyU.top.value.copy(P.top);skyU.hor.value.copy(P.hor);skyU.gnd.value.copy(P.fog).multiplyScalar(.8);skyU.sunDir.value.copy(sunDir);skyU.sunCol.value.copy(P.sun);skyU.sunSize.value=clamp(P.si,0,1.2)*(1-P.rain*.85)*(S.wx==='mist'?.3:1);
 sky.position.copy(cam.position);stars.position.copy(cam.position);starM.opacity=P.stars;
 mtnM.forEach((m,i)=>{tmpC.copy(P.top).lerp(P.hs,.4).multiplyScalar(.55);m.color.copy(P.fog).lerp(P.mt,.25*(1-i*.3)).lerp(tmpC,.3-i*.09)});
 GU.uBase.value.copy(P.gb);GU.uTip.value.copy(P.gt);GU.uSun.value.copy(P.sun).multiplyScalar(P.si*.85*sm(-2,6,P.el));GU.uAmb.value.copy(P.hs).multiplyScalar(P.hi*.75).add(tmpC.copy(P.hg).multiplyScalar(.15));GU.uTime.value=t;GU.uWind.value.set(.8,P.wind,.45);GU.uSnow.value=P.cover;
 grass.visible=S.grass;TU.uCover.value=P.cover;TU.uWet.value=P.wet;terrainMat.roughness=1-P.wet*.45;
 WU.uTime.value=t;WU.uSky.value.copy(P.hor);WU.uSunDir.value.copy(sunDir);WU.uSunCol.value.copy(P.sun).multiplyScalar(P.si);WU.uDeep.value.copy(P.wd).lerp(P.fog,.25);WU.uShallow.value.copy(P.ws).lerp(P.fog,.2);
 const lv=P.night;K.lamps.forEach(m=>m.emissiveIntensity=m.userData.base*(.03+.97*lv));K.glowSprites.forEach(s=>s.material.opacity=s.userData.base*lv);
 if(bloom){bloom.strength=.32+lv*.55+P.bolt*.2;bloom.threshold=.9-lv*.32}
 const under=cam.position.y<H(cam.position.x,cam.position.z)+.15;terrain.visible=skirt.visible=!under;grass.visible=S.grass&&!under;water.visible=!under;
 const env={wind:P.wind,night:lv,time:t,rain:P.rain,snow:P.snow,aurora:P.aurora};
 rain.userData.update(dt,t,env,cam.position);snow.userData.update(dt,t,env,cam.position);flies.userData.update(dt,t,{night:lv*(1-P.rain)});aur.userData.update(dt,t,env);birds.visible=lv<.5&&P.rain<.5;birds.userData.update(dt,t,env);
 if(P.bolt>.5){boltT-=dt;if(boltT<0){const a=Math.random()*TAU,d=50+Math.random()*60,p=V3(cam.position.x+Math.cos(a)*d,0,cam.position.z+Math.sin(a)*d);p.y=H(p.x,p.z);bolt.userData.strike(p);AU.thunder(d/120);boltT=3+Math.random()*6}}
 bolt.userData.update(dt);skyU.flash.value=bolt.userData.flash*.55;flashL.intensity=bolt.userData.flash*2.5;
 /* stage */
 if(cur.obj&&!dio.on&&!drive.on){if(S.turn)cur.obj.rotation.y+=dt*.35;cur.obj.userData.update&&cur.obj.userData.update(dt,t,env);
  if(cur.rig){cur.rig.setLights(cur.rig.cfg.lights==='auto'?(lv>.4||S.wx==='storm'||S.wx==='mist'?1:0):1,0);cur.rig.chassis.position.y=cur.rig.wr+Math.sin(t*31)*.0018*(cur.rig.engine.cyl?1:0)}
  GU.uPush2.value.set(cur.center.x,cur.center.z,ENTRY[cur.id].vehicle?cur.foot*.55:ENTRY[cur.id].cat==='Buildings'?cur.foot*.55:0,0)}else GU.uPush2.value.set(0,0,0,0);
 if(dio.on){for(const o of dio.objs){const r=o.userData.rig;if(r)r.setLights(lv>.4?1:0,0);o.userData.update&&o.userData.update(dt,t,env)}if(!tw){const a=t*.04;cam.position.lerp(V3(Math.cos(a)*27,9+Math.sin(t*.1)*1.5,Math.sin(a)*27),1-Math.exp(-dt*.6));ctl.target.lerp(V3(0,1.5,0),.02)}}
 let eng=null;if(drive.on){eng=updateDrive(dt,t);drive.rig.update(dt,t,env)}
 for(const s of dust){const u=s.userData;if(u.life>0){u.life-=dt*.7;s.position.addScaledVector(u.v,dt);u.v.multiplyScalar(.97);s.scale.setScalar(u.sz*(1.8-u.life));s.material.opacity=Math.max(0,u.life)*.45}else s.material.opacity=0}
 AU.tick({rain:P.rain,wind:P.wind,eng:!!eng,...(eng||{}),fire:(cur.id==='firepit'||dio.on)?1:0,birds:lv<.4&&P.rain<.3});
 if(tw){tw.t+=dt;const k=tw.d?Math.min(1,tw.t/tw.d):1,e=k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2;cam.position.lerpVectors(tw.p0,tw.p1,e);ctl.target.lerpVectors(tw.t0,tw.t1,e);if(k>=1)tw=null}
 if(!drive.on||drive.camMode==='orbit')ctl.update();
 uiT-=dt;if(uiT<0){uiT=.25;const rs=document.documentElement.style;rs.setProperty('--sky-a',hex(P.top));rs.setProperty('--sky-b',hex(P.hor));tmpC.copy(P.sun).lerp(C(0xe2672e),.45);rs.setProperty('--accent',hex(tmpC));
  const dark=lv>.55||(P.hor.r*.3+P.hor.g*.59+P.hor.b*.11)<.33;document.documentElement.dataset.theme=dark?'dark':'light'}
 if(composer)composer.render();else R.render(scene,cam);requestAnimationFrame(loop)}

/* ---------- boot ---------- */
paintTerrain(BIOMES[S.biome]);buildScatter(BIOMES[S.biome]);renderList();build('ranger40');uiSync();cam.position.set(9,3,8);loop();
})();
